server:
  port: 8082
  servlet:
    context-path: /

spring:
  application:
    name: msvc-events

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost:5432}/${DATABASE_NAME:koyebdb}
    username: ${DATABASE_USER:root}
    password: ${DATABASE_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER

  security:
    user:
      password: root

springdoc:
  enable-native-support: true
  api-docs:
    enabled: true
    path: /msvc-events/v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    url: /msvc-events/v3/api-docs
    config-url: /msvc-events/v3/api-docs/swagger-config
    urls:
      - url: /msvc-events/v3/api-docs
        name: msvc-events
        display-name: msvc-events

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_CLIENT:localhost:8761}/eureka
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

logging:
  level:
    root: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health, mappings

openapi:
  service:
    title: msvc-events doc
    version: 1.0.0
    url: http://${URL_SERVICE:localhost}:8080
